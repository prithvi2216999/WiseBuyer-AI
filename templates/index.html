<!DOCTYPE html>
<html>
<head>
    <title>WiseBuyer AI</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>

<body>

<div class="app-container">

    <!-- HEADER -->
    <div class="header">
        <h1>🤖 WiseBuyer AI</h1>
        <p>Your Futuristic Smart Purchase Advisor</p>
    </div>

    <!-- CENTER CATEGORY PANEL (Fixit AI Style) -->
    <div id="categoryPanel" class="category-center-box" style="display:none;"></div>

    <!-- CHAT AREA -->
    <div id="chatbox" class="chatbox"></div>

    <!-- BOTTOM OPTIONS BAR (for brand/model/sections) -->
    <div id="optionsPanel" class="options-panel"></div>

    <!-- INPUT AREA -->
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type here or tap a button..." />
        <button id="sendBtn">➤</button>
    </div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
